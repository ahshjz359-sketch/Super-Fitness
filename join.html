<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuperFitness - Join Now</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/join.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="js/nav.js"></script>
</head>
<body>

<header class="hero">
    <nav class="navbar">
  </nav>
  <div class="hero-content">
    <h4>PERSONAL GYM TRAINERS</h4>
    <h1>BE READY TO<br><span>BECOME HEALTHY</span></h1>
    <p>Fill in your details and start your fitness journey</p>
  </div>
</header>

<section class="join-section">
  <form id="joinForm">
    <h2>JOIN NOW</h2>

    <label for="name">Full Name:</label>
    <input type="text" id="name" placeholder="Your Name">

    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Your Age">

    <label for="height">Height (cm):</label>
    <input type="number" id="height" placeholder="Your Height">

    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" placeholder="Your Weight">

    <label for="gender">Gender:</label>
    <select id="gender" required>
      <option value="">Select your gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <label for="goal">Fitness Goal:</label>
    <select id="goal">
      <option value="">Select Goal</option>
      <option value="Lose Weight">Lose Weight</option>
      <option value="Build Muscle">Build Muscle</option>
      <option value="Increase Weight">Increase Weight</option>
      <option value="Stay Fit">Stay Fit</option>
    </select>

    <label for="program">Choose Program:</label>
    <select id="program">
      <option value="">Select Program</option>
      <option value="Basic Plan">Basic Plan</option>
      <option value="Regular Plan">Regular Plan</option>
      <option value="Premium Plan">Premium Plan</option>
      <option value="Advanced Plan">Advanced Plan</option>
      <option value="Ultimate Plan">Ultimate Plan</option>
      <option value="Pro Athlete Plan">Pro Athlete Plan</option>
    </select>

    <p id="priceDisplay">Price: $0 / Month</p>

    <label for="trainer">Choose Trainer:</label>
    <select id="trainer">
      <option value="">Select Trainer</option>
      <option value="Yousef Sameh">Yousef Sameh</option>
      <option value="Amera Yousef">Amera Yousef</option>
      <option value="Ramez Khaled">Ramez Khaled</option>
      <option value="Huda Sameh">Huda Sameh</option>
      <option value="Khaled Mohammed">Khaled Mohammed</option>
      <option value="Rouh Ahmed">Rouh Ahmed</option>
      <option value="Ahmed yaser">Ahmed yaser</option>
      <option value="Hoor Ahmed">Hoor Ahmed</option>
      <option value="Mohammed Ahmed">Mohammed Ahmed</option>
      <option value="Sara Ahmed">Sara Ahmed</option>
      <option value="Reem Ahmed">Reem Ahmed</option>
      <option value="Layla Hassan">Layla Hassan</option>
    </select>

    <button type="submit" class="submit-btn">Join Now</button>
  </form>
</section>

<script src="js/join.js"></script>

</body>
</html>
